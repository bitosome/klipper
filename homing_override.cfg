[homing_override]
axes: xyz
gcode:
    {% set homing_zhop = printer["gcode_macro _USER_VARIABLES"].homing_zhop|float|abs %}
    {% set homing_travel_speed = printer["gcode_macro _USER_VARIABLES"].homing_travel_speed * 60 %}
    {% set homing_travel_accel = printer["gcode_macro _USER_VARIABLES"].homing_travel_accel %}
    {% set sensorless_current_factor = printer["gcode_macro _USER_VARIABLES"].sensorless_current_factor / 100 %}
    {% set x_homing_backoff, y_homing_backoff = printer["gcode_macro _USER_VARIABLES"].homing_backoff_distance_xy|map('float') %}
    {% set homing_first = printer["gcode_macro _USER_VARIABLES"].homing_first|string|upper %}
    
    {% set X, Y, Z = False, False, False %}
    {% if not 'X' in params and not 'Y' in params and not 'Z' in params %}
        {% set X, Y, Z = True, True, True %}
        RESPOND MSG="Homing all axes (XYZ)"
    {% else %}
        {% if 'X' in params %}{% set X = True %}{% endif %}
        {% if 'Y' in params %}{% set Y = True %}{% endif %}
        {% if 'Z' in params %}{% set Z = True %}{% endif %}
        RESPOND MSG="Homing: " ~ ("X" if X else "") ~ ("Y" if Y else "") ~ ("Z" if Z else "")
    {% endif %}

    CASE_LIGHT ENABLE=1
    STATUS_LEDS COLOR="homing"
    {% set saved_accel = printer.toolhead.max_accel %}
    SET_VELOCITY_LIMIT ACCEL={homing_travel_accel}
    RESPOND MSG="Acceleration: " ~ homing_travel_accel|int ~ " mm/s²"

    {# ----- Z Safety ----- #}
    {% if Z %}
        {% if 'z' in printer.toolhead.homed_axes %}
            {% if printer.toolhead.position.z < homing_zhop %}
                RESPOND MSG="Z hop needed: " ~ printer.toolhead.position.z|round(2) ~ "mm < " ~ homing_zhop|round(1) ~ "mm"
                G91
                G0 Z{homing_zhop} F{printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60}
                G90
            {% else %}
                RESPOND MSG="Z safe at " ~ printer.toolhead.position.z|round(2) ~ "mm"
            {% endif %}
        {% elif 'xy' in printer.toolhead.homed_axes %}
            RESPOND MSG="Skipping Z hop (XY homed)"
        {% else %}
            RESPOND MSG="Full homing required"
            SET_KINEMATIC_POSITION X=0 Y=0 Z=0
            G0 Z{homing_zhop} F{printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60}
        {% endif %}
    {% endif %}

    {# ----- X/Y Homing ----- #}
    {% if X or Y %}
        {% set old_x = printer.configfile.config["tmc2209 stepper_x"].run_current|float %}
        {% set old_y = printer.configfile.config["tmc2209 stepper_y"].run_current|float %}
        {% set new_x = old_x * sensorless_current_factor %}
        {% set new_y = old_y * sensorless_current_factor %}
        
        RESPOND MSG="Current: " ~ (sensorless_current_factor * 100)|int ~ "% (X" ~ new_x|round(2) ~ "A/Y" ~ new_y|round(2) ~ "A)"
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_x}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_y}
        M400

        {% if homing_first == "X" %}
            {% if X %}
                RESPOND MSG="Homing X"
                G28 X0
                G1 X{printer.configfile.config["stepper_x"]["position_endstop"]|float + x_homing_backoff} F{homing_travel_speed}
                RESPOND MSG="X backed off " ~ x_homing_backoff|round(1) ~ "mm"
            {% endif %}
            {% if Y %}
                RESPOND MSG="Homing Y"
                G28 Y0
                G1 Y{printer.configfile.config["stepper_y"]["position_endstop"]|float + y_homing_backoff} F{homing_travel_speed}
                RESPOND MSG="Y backed off " ~ y_homing_backoff|round(1) ~ "mm"
            {% endif %}
        {% else %}
            {% if Y %}
                RESPOND MSG="Homing Y"
                G28 Y0
                G1 Y{printer.configfile.config["stepper_y"]["position_endstop"]|float + y_homing_backoff} F{homing_travel_speed}
                RESPOND MSG="Y backed off " ~ y_homing_backoff|round(1) ~ "mm"
            {% endif %}
            {% if X %}
                RESPOND MSG="Homing X"
                G28 X0
                G1 X{printer.configfile.config["stepper_x"]["position_endstop"]|float + x_homing_backoff} F{homing_travel_speed}
                RESPOND MSG="X backed off " ~ x_homing_backoff|round(1) ~ "mm"
            {% endif %}
        {% endif %}
        
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_x}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_y}
        M400
        RESPOND MSG="Current restored: X" ~ old_x|round(2) ~ "A/Y" ~ old_y|round(2) ~ "A"
    {% endif %}

    {# ----- Z Homing ----- #}
    {% if Z %}
        RESPOND MSG="Homing Z"
        {% if printer.configfile.config["bed_mesh"]["zero_reference_position"] %}
            {% set z_ref = printer.configfile.config["bed_mesh"]["zero_reference_position"].split(',')|map('trim')|map('float') %}
            G0 X{z_ref[0]} Y{z_ref[1]} F{homing_travel_speed}
        {% else %}
            G0 X{(printer.toolhead.axis_maximum.x + printer.toolhead.axis_minimum.x)/2} Y{(printer.toolhead.axis_maximum.y + printer.toolhead.axis_minimum.y)/2} F{homing_travel_speed}
        {% endif %}
        G28 Z0
        G91
        G0 Z-{homing_zhop} F{printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60}
        G90
    {% endif %}

    SET_VELOCITY_LIMIT ACCEL={saved_accel}
    STATUS_LEDS COLOR="ready"
    RESPOND MSG="Homing complete"