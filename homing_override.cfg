[homing_override]
axes: xyz
gcode:
    {% set homing_zhop = printer["gcode_macro _USER_VARIABLES"].homing_zhop|float|abs %}
    {% set homing_travel_speed = printer["gcode_macro _USER_VARIABLES"].homing_travel_speed * 60 %}
    {% set homing_travel_accel = printer["gcode_macro _USER_VARIABLES"].homing_travel_accel %}
    {% set sensorless_current_factor = printer["gcode_macro _USER_VARIABLES"].sensorless_current_factor / 100 %}
    {% set x_homing_backoff, y_homing_backoff = printer["gcode_macro _USER_VARIABLES"].homing_backoff_distance_xy|map('float') %}
    {% set homing_first = printer["gcode_macro _USER_VARIABLES"].homing_first|string|upper %}
    
    {% set X, Y, Z = False, False, False %}
    {% if not 'X' in params and not 'Y' in params and not 'Z' in params %}
        {% set X, Y, Z = True, True, True %}
        RESPOND MSG="Homing all axes (XYZ)"
    {% else %}
        {% if 'X' in params %}{% set X = True %}{% endif %}
        {% if 'Y' in params %}{% set Y = True %}{% endif %}
        {% if 'Z' in params %}{% set Z = True %}{% endif %}
        RESPOND MSG="Homing axes: " ~ ("X" if X else "") ~ ("Y" if Y else "") ~ ("Z" if Z else "")
    {% endif %}

    CASE_LIGHT ENABLE=1
    STATUS_LEDS COLOR="homing"
    {% set saved_accel = printer.toolhead.max_accel %}
    SET_VELOCITY_LIMIT ACCEL={homing_travel_accel}
    RESPOND MSG="Homing acceleration set to " ~ homing_travel_accel|int ~ " mm/s²"

    {# ----- Z Safety Checks ----- #}
    {% if Z %}
        {% if 'z' in printer.toolhead.homed_axes %}
            {% if printer.toolhead.position.z < homing_zhop %}
                RESPOND MSG="Z at " ~ printer.toolhead.position.z|float|round(2) ~ "mm < " ~ homing_zhop|float|round(1) ~ "mm - performing ZHOP"
                G91
                G0 Z{homing_zhop} F{printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60}
                G90
            {% else %}
                RESPOND MSG="Z already safe at " ~ printer.toolhead.position.z|float|round(2) ~ "mm"
            {% endif %}
        {% elif 'xy' in printer.toolhead.homed_axes %}
            RESPOND MSG="XY homed - proceeding directly to Z homing"
        {% else %}
            RESPOND MSG="Full homing required - resetting kinematic position"
            SET_KINEMATIC_POSITION X=0 Y=0 Z=0
            G0 Z{homing_zhop} F{printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60}
        {% endif %}
    {% endif %}

    {# ----- Sensorless X/Y Homing ----- #}
    {% if X or Y %}
        {% set old_x_cur = printer.configfile.config["tmc2209 stepper_x"].run_current|float %}
        {% set old_y_cur = printer.configfile.config["tmc2209 stepper_y"].run_current|float %}
        {% set new_x_cur = old_x_cur * sensorless_current_factor %}
        {% set new_y_cur = old_y_cur * sensorless_current_factor %}
        
        RESPOND MSG="Sensorless homing: Reducing XY currents to " ~ (sensorless_current_factor * 100)|int ~ "%"
        RESPOND MSG="Original currents: X=" ~ old_x_cur|round(2) ~ "A, Y=" ~ old_y_cur|round(2) ~ "A"
        RESPOND MSG="Homing currents: X=" ~ new_x_cur|round(2) ~ "A, Y=" ~ new_y_cur|round(2) ~ "A"

        {% if homing_first == "X" %}
            {% if X %}
                RESPOND MSG="Homing X axis (sensorless)"
                SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_x_cur}
                SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_y_cur}
                M400
                G28 X0
                G1 X{printer.configfile.config["stepper_x"]["position_endstop"]|float + x_homing_backoff} F{homing_travel_speed}
                RESPOND MSG="X homed + " ~ x_homing_backoff|float|round(1) ~ "mm backoff"
            {% endif %}
            {% if Y %}
                RESPOND MSG="Homing Y axis (sensorless)"
                SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_x_cur}
                SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_y_cur}
                M400
                G28 Y0
                G1 Y{printer.configfile.config["stepper_y"]["position_endstop"]|float + y_homing_backoff} F{homing_travel_speed}
                RESPOND MSG="Y homed + " ~ y_homing_backoff|float|round(1) ~ "mm backoff"
            {% endif %}
        {% elif homing_first == "Y" %}
            {% if Y %}
                RESPOND MSG="Homing Y axis (sensorless)"
                SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_x_cur}
                SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_y_cur}
                M400
                G28 Y0
                G1 Y{printer.configfile.config["stepper_y"]["position_endstop"]|float + y_homing_backoff} F{homing_travel_speed}
                RESPOND MSG="Y homed + " ~ y_homing_backoff|float|round(1) ~ "mm backoff"
            {% endif %}
            {% if X %}
                RESPOND MSG="Homing X axis (sensorless)"
                SET_TMC_CURRENT STEPPER=stepper_x CURRENT={new_x_cur}
                SET_TMC_CURRENT STEPPER=stepper_y CURRENT={new_y_cur}
                M400
                G28 X0
                G1 X{printer.configfile.config["stepper_x"]["position_endstop"]|float + x_homing_backoff} F{homing_travel_speed}
                RESPOND MSG="X homed + " ~ x_homing_backoff|float|round(1) ~ "mm backoff"
            {% endif %}
        {% else %}
            RESPOND TYPE=error MSG="Invalid homing_first='" ~ homing_first ~ "' - use X/Y"
            ABORT
        {% endif %}
        
        RESPOND MSG="Restoring XY currents"
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={old_x_cur}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={old_y_cur}
        M400
        RESPOND MSG="Currents restored: X=" ~ old_x_cur|round(2) ~ "A, Y=" ~ old_y_cur|round(2) ~ "A"
    {% endif %}

    {# ----- Z Homing with Cartographer3D ----- #}
    {% if Z %}
        RESPOND MSG="Starting Z homing sequence"
        {% if printer.configfile.config["bed_mesh"]["zero_reference_position"] %}
            {% set ZRPx, ZRPy = printer.configfile.config["bed_mesh"]["zero_reference_position"].split(',')|map('trim')|map('float') %}
            RESPOND MSG="Moving to bed mesh zero: X" ~ ZRPx|round(1) ~ " Y" ~ ZRPy|round(1)
            G0 X{ZRPx} Y{ZRPy} F{homing_travel_speed}
        {% else %}
            {% set x_center = (printer.toolhead.axis_maximum.x + printer.toolhead.axis_minimum.x)/2 %}
            {% set y_center = (printer.toolhead.axis_maximum.y + printer.toolhead.axis_minimum.y)/2 %}
            RESPOND MSG="Moving to bed center: X" ~ x_center|round(1) ~ " Y" ~ y_center|round(1)
            G0 X{x_center} Y{y_center} F{homing_travel_speed}
        {% endif %}
        
        G28 Z0
        RESPOND MSG="Z homing complete - performing safety retract"
        G91
        G0 Z-{homing_zhop} F{printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60}
        G90
    {% endif %}

    SET_VELOCITY_LIMIT ACCEL={saved_accel}
    STATUS_LEDS COLOR="ready"
    RESPOND MSG="Homing sequence completed successfully"
    RESPOND MSG="Restored acceleration to " ~ saved_accel|int ~ " mm/s²"