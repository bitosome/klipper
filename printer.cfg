    EXP1_7=PE15  , EXP1_8=PB10  ,
    EXP1_9=<GND> , EXP1_10=<5V> ,
    EXP2_1=PB14  , EXP2_2=PB13  ,
    EXP2_3=PF7   , EXP2_4=PB12  ,
    EXP2_5=PE7   , EXP2_6=PB11  ,  # Slot in the socket on this side
    EXP2_7=PE8   , EXP2_8=<RST> ,
    EXP2_9=<GND> , EXP2_10=PC5  ,

# ┌─────────────────────────────────────┐
# │     BTT EBB36 CAN v1.2
# └─────────────────────────────────────┘

[mcu toolhead]
canbus_uuid: 4202d7c42291

[board_pins toolhead_manufacturer]
mcu: toolhead
aliases:
    MCU_TMCDRIVER_STEP=PD0 , MCU_TMCDRIVER_DIR=PD1 , MCU_TMCDRIVER_ENABLE=PD2 , MCU_TMCDRIVER_UART=PA15 ,
    MCU_ENDSTOP1=PB6 , MCU_ENDSTOP2=PB5 , MCU_ENDSTOP3=PB7 ,
    MCU_PROBE=PB8 ,
    MCU_SERVOS=PB9 ,
    MCU_HOTEND0=PB13 ,
    MCU_TH0=PA3 ,
    MCU_FAN1=PA0 , MCU_FAN2=PA1 ,
    MCU_RGB=PD3 ,
    MCU_SPI1_CS=PA4  , MCU_SPI1_SCLK=PA5  , MCU_SPI1_MISO=PA6 , MCU_SPI1_MOSI=PA7  ,
    MCU_SPI2_CS=PB12 , MCU_SPI2_SCLK=PB10 , MCU_SPI2_MISO=PB2 , MCU_SPI2_MOSI=PB11 ,

# ┌─────────────────────────────────────┐
# │     BED
# └─────────────────────────────────────┘

[heater_bed]
heater_pin: MCU_HE1
sensor_pin: MCU_THB
sensor_type: Generic 3950
max_power: 1
min_temp: 0
max_temp: 125
#control: pid
#pid_kp: 46.971
#pid_ki: 1.864
#pid_kd: 295.919

# ┌─────────────────────────────────────┐
# │     EXTRUDER
# │     ldo-36sth20-1004ahg-9T
# │     resistance: 2.4
# │     inductance: 0.0014
# │     holding_torque: 0.10
# │     max_current: 1.0
# │     steps_per_revolution: 200
# └─────────────────────────────────────┘

[extruder]
step_pin: toolhead:MCU_TMCDRIVER_STEP
dir_pin: toolhead:MCU_TMCDRIVER_DIR
enable_pin: !toolhead:MCU_TMCDRIVER_ENABLE

rotation_distance: 47.088
microsteps: 16
gear_ratio: 9:1

heater_pin: toolhead:MCU_HOTEND0
#control: pid
#pid_kp: 17.776
#pid_ki: 1.129
#pid_kd: 69.993

sensor_type: MAX31865
sensor_pin: toolhead:MCU_SPI1_CS
spi_bus: spi1
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2

pressure_advance: 0.029
pressure_advance_smooth_time: 0.02

nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 110
max_extrude_cross_section: 5
min_temp: 0
max_temp: 300
max_power: 1
min_extrude_temp: 200

[tmc2209 extruder]
uart_pin: toolhead:MCU_TMCDRIVER_UART
interpolate: False
run_current: 0.6

# ┌─────────────────────────────────────┐
# │     X MOTOR (B)
# │     moons-ms17hd6p420I-04
# │     resistance: 1.3
# │     inductance: 0.0027
# │     holding_torque: 0.67
# │     max_current: 2.0
# │     steps_per_revolution: 200
# └─────────────────────────────────────┘

[stepper_x]
step_pin: MCU_M1_STEP
dir_pin: MCU_M1_DIR
enable_pin: !MCU_M1_EN

rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200

homing_speed: 40
homing_retract_dist: 0

position_min: 0
position_max: 350
position_endstop: 350
endstop_pin: tmc2209_stepper_x:virtual_endstop

[tmc2209 stepper_x]
uart_pin: MCU_M1_CS
diag_pin: MCU_M1_STOP
interpolate: False
run_current: 0.8
driver_SGTHRS: 108

# ┌─────────────────────────────────────┐
# │     Y MOTOR (A)
# │     moons-ms17hd6p420I-04
# └─────────────────────────────────────┘

[stepper_y]
step_pin: MCU_M2_STEP
dir_pin: MCU_M2_DIR
enable_pin: !MCU_M2_EN

rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200

homing_speed: 50
homing_retract_dist: 0

position_min: 0
position_max: 350
position_endstop: 350
endstop_pin: tmc2209_stepper_y:virtual_endstop

[tmc2209 stepper_y]
uart_pin: MCU_M2_CS
diag_pin: ^MCU_M2_STOP
interpolate: False
run_current: 0.8
driver_SGTHRS: 104

# ┌─────────────────────────────────────┐
# │     Z0 MOTOR (FRONT LEFT)
# │     moons-ms17hd6p420I-04
# └─────────────────────────────────────┘

[stepper_z]
step_pin: MCU_M3_STEP
dir_pin: MCU_M3_DIR
enable_pin: !MCU_M3_EN

rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

homing_speed: 50
homing_retract_dist: 0

position_max: 325
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z]
uart_pin: MCU_M3_CS
interpolate: False
run_current: 0.8

# ┌─────────────────────────────────────┐
# │     Z1 MOTOR (REAR LEFT)
# │     moons-ms17hd6p420I-04
# └─────────────────────────────────────┘

[stepper_z1]
step_pin: MCU_M4_STEP
dir_pin: !MCU_M4_DIR
enable_pin: !MCU_M4_EN

rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: MCU_M4_CS
interpolate: False
run_current: 0.8

# ┌─────────────────────────────────────┐
# │     Z2 MOTOR (REAR RIGHT)
# │     moons-ms17hd6p420I-04
# └─────────────────────────────────────┘

[stepper_z2]
step_pin: MCU_M5_STEP
dir_pin: MCU_M5_DIR
enable_pin: !MCU_M5_EN

rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

[tmc2209 stepper_z2]
uart_pin: MCU_M5_CS
interpolate: False
run_current: 0.8

# ┌─────────────────────────────────────┐
# │     Z3 MOTOR (FRONT RIGHT)
# │     moons-ms17hd6p420I-04
# └─────────────────────────────────────┘

[stepper_z3]
step_pin: MCU_M6_STEP
dir_pin: !MCU_M6_DIR
enable_pin: !MCU_M6_EN

rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

[tmc2209 stepper_z3]
uart_pin: MCU_M6_CS
interpolate: False
run_current: 0.8

# ┌─────────────────────────────────────┐
# │     TEMPERATURE SENSORS
# └─────────────────────────────────────┘

[temperature_sensor CM4]
sensor_type: temperature_host
min_temp: 0
max_temp: 90

[temperature_sensor MANTA_M8P_v1_1]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 90

[temperature_sensor BTT_EBB36_CAN_v1_2]
sensor_type: temperature_mcu
sensor_mcu: toolhead
min_temp: 0
max_temp: 90

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: MCU_TH0

[temperature_sensor Cartographer]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105

[temperature_sensor Hotend_Heatsink]
sensor_type: Generic 3950
sensor_pin: toolhead:PA3
max_temp: 85

# ┌─────────────────────────────────────┐
# │     LIGHT
# └─────────────────────────────────────┘

[neopixel status_leds]
pin: toolhead:MCU_RGB
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[output_pin caselight]
pin: MCU_HE3
pwm: true
value: 0
scale: 100
cycle_time: 0.010

# ┌─────────────────────────────────────┐
# │     FANS
# └─────────────────────────────────────┘
   
[controller_fan controller_fans]
pin: MCU_FAN5
tachometer_pin: MCU_FAN5_TACH
max_power: 1.0
kick_start_time: 0.100
fan_speed: 0.7
idle_timeout: 60

[heater_fan hotend_fan]
pin: toolhead:MCU_FAN1
heater: extruder
heater_temp: 50.0

[fan]
pin: toolhead:MCU_FAN2

[fan_generic filter]
pin: MCU_FAN3
max_power: 1.0
kick_start_time: 0.100
off_below: 0.30

# ┌─────────────────────────────────────┐
# │     FILAMENT SENSOR
# └─────────────────────────────────────┘

[filament_switch_sensor switch_sensor]
switch_pin: ^MCU_M5_STOP
pause_on_runout: False
runout_gcode: _FILAMENT_SENSOR_NOTIFICATION MESSAGE="Ran out of filement!"
insert_gcode: _FILAMENT_SENSOR_NOTIFICATION MESSAGE="Filament inserted"
#event_delay:
#pause_delay:

[filament_motion_sensor motion_sensor]
switch_pin: ^MCU_M6_STOP
detection_length: 2.88 # accuracy of motion sensor 2.88mm
extruder: extruder
pause_on_runout: False
runout_gcode: _FILAMENT_SENSOR_NOTIFICATION MESSAGE="Filament motion not detected!"
insert_gcode: _FILAMENT_SENSOR_NOTIFICATION MESSAGE="Filament inserted"
#event_delay:
#pause_delay:

