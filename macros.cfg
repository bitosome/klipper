[gcode_macro START_PRINT]
gcode:
# OrcaSlicer: START_PRINT EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[hot_plate_temp_initial_layer] BED_HEATSOAK_TIME=5 CHAMBER_HEATSOAK_TARGET_TEMP=[chamber_temperature] CHAMBER_HEATSOAK_MAX_TIME=15 MATERIAL=[filament_type]
    {% set BED_TEMP =                       params.BED_TEMP|default(printer["gcode_macro _USER_VARIABLES"].default_bed_temp)|int %}
    {% set EXTRUDER_TEMP =                  params.EXTRUDER_TEMP|default(printer["gcode_macro _USER_VARIABLES"].print_default_extruder_temp)|float %}
    {% set MATERIAL =                       params.MATERIAL|default(printer["gcode_macro _USER_VARIABLES"].print_default_material)|string %}
    {% set BED_HEATSOAK_TIME =              params.BED_HEATSOAK_TIME|default(printer["gcode_macro _USER_VARIABLES"].print_default_bed_heatsoak_time)|int %}
    {% set CHAMBER_HEATSOAK_TARGET_TEMP =   params.CHAMBER_HEATSOAK_TARGET_TEMP|default(printer["gcode_macro _USER_VARIABLES"].default_chamber_heatsoak_target_temp)|int %}
    {% set CHAMBER_HEATSOAK_MAX_TIME =      params.CHAMBER_HEATSOAK_MAX_TIME|default(printer["gcode_macro _USER_VARIABLES"].default_chamber_heatsoak_max_time)|int %}

    {% set light_intensity_start_print =    printer["gcode_macro _USER_VARIABLES"].light_intensity_start_print %}
    {% set light_intensity_printing =       printer["gcode_macro _USER_VARIABLES"].light_intensity_printing %}
    {% set filter_speed_printing =          printer["gcode_macro _USER_VARIABLES"].filter_speed_printing %}

    SAVE_VARIABLE VARIABLE=last_material VALUE='"{MATERIAL}"'
    SAVE_VARIABLE VARIABLE=last_extruder_temperature VALUE={EXTRUDER_TEMP|float}
    SAVE_VARIABLE VARIABLE=last_bed_temperature VALUE={BED_TEMP|float}

    RESPOND MSG="Printing with {MATERIAL} at {EXTRUDER_TEMP}°C"
    STATUS_LEDS COLOR="BUSY"
    CASELIGHT ENABLE=1 INTENSITY={light_intensity_start_print}

    UPDATE_DELAYED_GCODE ID=_FILTER_DELAYED DURATION=0

    M221 S100
    M220 S100
    G90
    M83
    G28

    HEATSOAK_BED TEMP={BED_TEMP} TIME={BED_HEATSOAK_TIME}
    HEATSOAK_CHAMBER TEMP={CHAMBER_HEATSOAK_TARGET_TEMP} TIME={CHAMBER_HEATSOAK_MAX_TIME}

    STATUS_LEDS COLOR="LEVELING"
    RESPOND MSG="Performing quad gantry leveling"
    G28 Z
    QUAD_GANTRY_LEVEL
    G28 Z
    STATUS_LEDS COLOR="READY"

    STATUS_LEDS COLOR="MESHING"
    RESPOND MSG="Performing bed meshing"
    BED_MESH_CALIBRATE
    STATUS_LEDS COLOR="READY"

    STATUS_LEDS COLOR="calibrating_z"
    RESPOND MSG="Performing touch probe"
    M109 S140
    CLEAN_NOZZLE
    CARTOGRAPHER_TOUCH
    STATUS_LEDS COLOR="READY"

    PRIMELINE TEMP={EXTRUDER_TEMP}

    FILTER ENABLED=1 SPEED={filter_speed_printing}
    FILAMENT_SENSORS ENABLED=1
    STATUS_LEDS COLOR="PRINTING"
    CASELIGHT ENABLE=1 INTENSITY={light_intensity_printing}
    RESPOND MSG="Printing"
    G92 E0.0


[gcode_macro END_PRINT]
gcode:
    {% set light_intensity_end_print =      printer["gcode_macro _USER_VARIABLES"].light_intensity_end_print %}
    {% set filter_name =                    printer["gcode_macro _USER_VARIABLES"].filter_name %}
    {% set filter = 			            "fan_generic " ~ filter_name %}
    {% set filter_time =                    printer["gcode_macro _USER_VARIABLES"].filter_time|default(600)|int %}
    
    PARK

    {% if printer.extruder.can_extrude %}
        G92 E0
        G1 E-10 F2100
    {% endif %}

    TURN_OFF_HEATERS

    M107
    M400

    {% if printer[filter].speed > 0 %}
        FILTER ENABLED=1 SPEED=100
        UPDATE_DELAYED_GCODE ID=_FILTER_DELAYED DURATION={filter_time}
    {% endif %}

    CASELIGHT ENABLE=1 INTENSITY={light_intensity_end_print}
    FILAMENT_SENSORS ENABLED=0
    STATUS_LEDS COLOR="DONE_PRINTING"

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% if printer.pause_resume.is_paused %}
        RESPOND MSG="Already paused"
    {% else %}
        SAVE_GCODE_STATE NAME=PAUSE_STATE
        BASE_PAUSE
        PARK
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% if not printer.pause_resume.is_paused %}
        RESPOND MSG="Not paused"
    {% else %}
        RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1
        BASE_RESUME
    {% endif %}


[gcode_macro PARK]
gcode:
    {% set Px, Py =         printer["gcode_macro _USER_VARIABLES"].park_position_xy|map('float') %}
    {% set Px =             params.X|default(Px)|float %}
    {% set Py =             params.Y|default(Py)|float %}
    {% set park_lift_z =    printer["gcode_macro _USER_VARIABLES"].park_lift_z %}
    {% set Z_HOP =          params.Z_HOP|default(park_lift_z)|float %}
    {% set St =             printer["gcode_macro _USER_VARIABLES"].travel_speed * 60 %}
    {% set Sz =             printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60 %}
    {% set max_z =          printer.toolhead.axis_maximum.z - printer.gcode_move.homing_origin.z |float %}
    {% set act_z =          printer.toolhead.position.z|float %}
    {% set z_safe =         act_z + Z_HOP %}

    {% if z_safe > max_z %}
        {% set z_safe = max_z %}
    {% endif %}

    {% if printer.toolhead.homed_axes != "xyz" %}
       {action_raise_error("Axis not homed, ABORTING")}
    {% endif %}

    SAVE_GCODE_STATE NAME=PARK

        {% if printer.extruder.can_extrude %}
            {% if params.E is defined %}
                {% set E = params.E|float|abs %}
                RESPOND MSG="Retraction overrided with parameter, Extruder retraction = {E}"
            {% else %}
                {% set E = 1.7 %}
                RESPOND MSG="Extruder retraction = {E}"
            {% endif %}

            {% if E is defined and E > 0 %}
                G92 E0
                G1 E-{E} F2100
            {% endif %}
        {% endif %}
        G90
        G1 Z{z_safe} F{Sz}
        G0 X{Px} Y{Py} F{St}

    RESTORE_GCODE_STATE NAME=PARK


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set light_intensity_end_print =  printer["gcode_macro _USER_VARIABLES"].light_intensity_end_print %}
    {% set filter_time =                printer["gcode_macro _USER_VARIABLES"].filter_time|default(600)|int %}
    {% set filter_name = 		        printer["gcode_macro _USER_VARIABLES"].filter_name %}
    {% set filter = 			        "fan_generic " ~ filter_name %}
    
    PARK

    {% if printer.extruder.can_extrude %}
        G92 E0
        G1 E-10 F2100
    {% endif %}

    TURN_OFF_HEATERS

    M107
    M400
    CLEAR_PAUSE
    SDCARD_RESET_FILE

    {% if printer[filter].speed > 0 %}
        FILTER ENABLED=1 SPEED=100
        UPDATE_DELAYED_GCODE ID=_FILTER_DELAYED DURATION={filter_time}
    {% endif %}

    CASELIGHT ENABLE=1 INTENSITY={light_intensity_end_print}
    STATUS_LEDS COLOR="OFF"
    BASE_CANCEL_PRINT


[gcode_macro _CG28]
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        STATUS_LEDS COLOR="HOMING"
        G28
        STATUS_LEDS COLOR="READY"
    {% endif %}


[gcode_macro PRIMELINE]
gcode:
    {% set TEMP =                           params.TEMP|default(printer.save_variables.variables.last_extruder_temperature)|float %}
    
    RESPOND MSG="Priming nozzle at {TEMP}°C"
    M109 S{TEMP}

    {% set prime_line_length =              params.LINE_LENGTH|default(printer["gcode_macro _USER_VARIABLES"].prime_line_length)|float %}
    {% set prime_line_purge_distance =      params.PURGE_LENGTH|default(printer["gcode_macro _USER_VARIABLES"].prime_line_purge_distance)|float %}
    {% set prime_line_flowrate =            params.FLOWRATE|default(printer["gcode_macro _USER_VARIABLES"].prime_line_flowrate)|float %}
    {% set prime_line_height =              params.LINE_HEIGHT|default(printer["gcode_macro _USER_VARIABLES"].prime_line_height)|default(0.6)|float %}
    {% set prime_line_margin =              params.LINE_MARGIN|default(printer["gcode_macro _USER_VARIABLES"].prime_line_margin)|default(5.0)|float %} # Used only in adaptive mode
    {% set eo_points =                      printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
    {% set xMinSpec =                       eo_points|map(attribute=0)|min %}
    {% set yMinSpec =                       eo_points|map(attribute=1)|min %}
    {% set xMaxSpec =                       eo_points|map(attribute=0)|max %}
    {% set yMaxSpec =                       eo_points|map(attribute=1)|max %}
    {% set prime_line_x, prime_line_y =     printer["gcode_macro _USER_VARIABLES"].prime_line_xy|map('float') %}
    {% set prime_line_x =                   params.START_X|default(prime_line_x)|float %}
    {% set prime_line_y =                   params.START_Y|default(prime_line_y)|float %}
    {% set prime_line_direction =           params.LINE_DIRECTION|default(printer["gcode_macro _USER_VARIABLES"].prime_line_direction)|string|upper %}
    {% set center_x, center_y =             [printer.toolhead.axis_maximum.x / 2, printer.toolhead.axis_maximum.y / 2]|map("float") %}
    {% set prime_line_x =                   2*center_x - prime_line_x if (prime_line_x > center_x and xMaxSpec < center_x) or (prime_line_x < center_x and xMinSpec > center_x) else prime_line_x %}
    {% set prime_line_y =                   2*center_y - prime_line_y if (prime_line_y > center_y and yMaxSpec < center_y) or (prime_line_y < center_y and yMinSpec > center_y) else prime_line_y %}
    {% set prime_line_x =                   [[prime_line_x, xMinSpec - prime_line_margin]|max, xMaxSpec + prime_line_margin]|min %}
    {% set prime_line_y =                   [[prime_line_y, yMinSpec - prime_line_margin]|max, yMaxSpec + prime_line_margin]|min %}
    {% set prime_line_way =                 -1 if (prime_line_direction == "X" and prime_line_x > center_x) or (prime_line_direction == "Y" and prime_line_y > center_y) else 1 %}
    {% set St =                             printer["gcode_macro _USER_VARIABLES"].travel_speed * 60 %}
    {% set Sz =                             printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60 %}
    {% set max_extrude_cross_section =      printer["configfile"].config["extruder"]["max_extrude_cross_section"]|float %}
    {% set filament_diameter =              printer["configfile"].config["extruder"]["filament_diameter"]|float %}
    {% set purge_volume =                   prime_line_purge_distance * 3.14159 * (filament_diameter / 2)**2 %}
    {% set line_width =                     purge_volume / (prime_line_height * prime_line_length) %}

    {% if (prime_line_height * line_width) > max_extrude_cross_section %}
        {action_respond_info("The prime_line_purge_distance of %.4f mm is too high and will exceed the max_extrude_cross_section!" % prime_line_purge_distance)}
        {% set prime_line_purge_distance = 0.98 * (max_extrude_cross_section * prime_line_length) / (3.14159 * (filament_diameter / 2)**2) %}
        {% set purge_volume = prime_line_purge_distance * 3.14159 * (filament_diameter / 2)**2 %}
        {% set line_width = purge_volume / (prime_line_height * prime_line_length) %}
        {action_respond_info("Corrected the prime_line_purge_distance to %.4f mm" % prime_line_purge_distance)}
    {% endif %}

    {% if (prime_line_height / line_width) >= 0.5 %}
        {action_raise_error("The prime line will be too thin and will probably not stick properly to the bed. Increase its purge distance or decrease its length!")}
    {% endif %}

    {% set speed = (prime_line_flowrate / (prime_line_height * line_width)) * 60 |float %}
    G91
    M83

    {% if (printer.toolhead.position.z < 5) %}
        G1 Z5 F{Sz}
    {% endif %}

    G90
    G0 X{prime_line_x} Y{prime_line_y} F{St}
    G1 Z{prime_line_height} F{Sz|int / 2}
    G92 E0
    G1 E18 F300
    # Prime line
    G92 E0

    {% if prime_line_direction == "X" %}
        G1 X{prime_line_x + prime_line_way*prime_line_length} E{prime_line_purge_distance} F{speed}
    {% elif prime_line_direction == "Y" %}
        G1 Y{prime_line_y + prime_line_way*prime_line_length} E{prime_line_purge_distance} F{speed}
    {% else %}
        { action_respond_error("Prime line direction is not valid. Choose either X or Y in the variables.cfg file!") }
    {% endif %}

    G92 E0
    G1 E-0.2 F2100
    G92 E0
    G1 Z3 F{Sz}
    G91
    G1 X2 Y2 F{St}
    G90
    M400


[gcode_macro CASELIGHT]
gcode:
    {% set ENABLED = params.ENABLED|default("1")|int %}
    {% set INTENSITY = params.INTENSITY|default(100)|float %}
    {% set light_pin_name = printer["gcode_macro _USER_VARIABLES"].light_pin_name %}

    {% if ENABLED == 1 %}
        SET_PIN PIN={light_pin_name} value={INTENSITY}
        RESPOND MSG="Caselight enabled, intensity: {INTENSITY}"
    {% elif ENABLED == 0 %}
        SET_PIN PIN={light_pin_name} value=0
        RESPOND MSG="Caselight disabled"
    {% else %}
        RESPOND MSG="Error: Invalid ENABLED value; must be 0 or 1"
    {% endif %}


[gcode_macro CLEAN_NOZZLE]
gcode:
    {% set brush_clean_accel =  printer["gcode_macro _USER_VARIABLES"].brush_clean_accel|default(1000)|float %}
    {% set brush_offset =       printer["gcode_macro _USER_VARIABLES"].brush_center_offset|default(0)|float %}
    {% set brush_size =         printer["gcode_macro _USER_VARIABLES"].brush_width_x|default(40)|float %}
    {% set brushes =            printer["gcode_macro _USER_VARIABLES"].brushes|default(6)|int %}
    {% set travel_speed =       printer["gcode_macro _USER_VARIABLES"].travel_speed|default(100)|float * 60 %}
    {% set z_drop_speed =       printer["gcode_macro _USER_VARIABLES"].z_drop_speed|default(50)|float * 60 %}
    {% set Sc =                 printer["gcode_macro _USER_VARIABLES"].brush_clean_speed|default(30)|float * 60 %}
    {% set Bx, By, Bz =         printer["gcode_macro _USER_VARIABLES"].brush_xyz|default("0,0,10")|map('float') %}
    {% set Bx =                 Bx + brush_offset %}
    {% set original_z =         printer.toolhead.position.z %}

    {% if printer.toolhead.homed_axes != "xyz" %}
       {action_raise_error("Axis not homed, ABORTING")}
    {% endif %}

    RESPOND MSG="Starting nozzle cleaning"

    SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

        STATUS_LEDS COLOR="CLEANING"
        G90

        SET_VELOCITY_LIMIT ACCEL={brush_clean_accel}

        RESPOND MSG="Raising Z to {original_z + 5}"
        G1 Z{original_z + 5} F{z_drop_speed}
        
        G1 X{Bx} Y{By} F{travel_speed}
        G1 Z{Bz} F{z_drop_speed}

        G91

        {% if brush_offset < 0 %}
            G1 X{brush_size / 2} F{Sc}
        {% else %}
            G1 X{(brush_size / 2) - brush_offset} F{Sc}
        {% endif %}

        {% for _ in range(brushes) %}
            G1 X-{brush_size - brush_offset} F{Sc}
            G1 X+{brush_size - brush_offset} F{Sc}
        {% endfor %}

        M400

        G90

        {% set current_z = printer.toolhead.position.z %}
        {% if current_z < original_z %}
            RESPOND MSG="Raising Z to {original_z + 5}"
            G1 Z{original_z + 5} F{z_drop_speed}
        {% endif %}

        RESPOND MSG="Nozzle cleaning complete"
        STATUS_LEDS COLOR="READY"

    RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE MOVE=1 MOVE_SPEED={travel_speed}


[gcode_macro FILAMENT_SENSORS]
gcode:
    {% set ENABLED = params.ENABLED|default("1")|int %}

    {% if ENABLED == 1 %}
        SET_FILAMENT_SENSOR SENSOR="motion_sensor" ENABLE=1
        SET_FILAMENT_SENSOR SENSOR="switch_sensor" ENABLE=1
        RESPOND MSG="Filament sensors enabled"
    {% elif ENABLED == 0 %}
        SET_FILAMENT_SENSOR SENSOR="motion_sensor" ENABLE=0
        SET_FILAMENT_SENSOR SENSOR="switch_sensor" ENABLE=0
        RESPOND MSG="Filament sensors disabled"
    {% else %}
        RESPOND TYPE=error MSG="Invalid ENABLED value, must be 0 or 1"
    {% endif %}


[gcode_macro _FILAMENT_SENSOR_NOTIFICATION]
gcode:
    {% set MESSAGE = params.MESSAGE|string %}

    RESPOND MSG="{MESSAGE}"


[gcode_macro HEATSOAK_BED]
gcode:
    {% set BED_TEMP =               params.TEMP|default(printer.save_variables.variables.last_bed_temperature)|float %}
    {% set BED_HEATSOAK_TIME =      params.TIME|default(printer["gcode_macro _USER_VARIABLES"].default_bed_heatsoak_time)|int %}
    {% set travel_speed=                    printer["gcode_macro _USER_VARIABLES"].travel_speed * 60 %}
    {% set max_x =                          printer.toolhead.axis_maximum.x|float %}
    {% set max_y =                          printer.toolhead.axis_maximum.y|float %}

    RESPOND MSG="Heatsoking bed. Target: {BED_TEMP}°C, {BED_HEATSOAK_TIME} minute(s)"
    STATUS_LEDS COLOR="HEATING"

    RESPOND MSG="Setting bed temparature to {BED_TEMP}°C"
    M190 S{BED_TEMP}
    
    FILTER ENABLED=1 SPEED=100
    M106 S230

    {% if printer.toolhead.homed_axes != "xyz" %}
        RESPOND TYPE=error MSG="Axis not homed, toolhead will not move to the center"
    {% else %}
        G0 X{max_x|int / 2} Y{max_y|int / 2} Z50 F{travel_speed}
    {% endif %}

    {% for t in range(0, BED_HEATSOAK_TIME * 2) %}
        RESPOND MSG="Heatsoaking bed, {BED_HEATSOAK_TIME - t * 0.5} minute(s) left"
        G4 P30000 # 30 seconds
    {% endfor %}

    RESPOND MSG="Bed heatsoaking complete. Bed heater: ON"
    STATUS_LEDS COLOR="READY"


[gcode_macro HEATSOAK_CHAMBER]
gcode:
    {% set CHAMBER_HEATSOAK_TARGET_TEMP =   params.TEMP|default(printer["gcode_macro _USER_VARIABLES"].default_chamber_heatsoak_target_temp)|int %}
    {% set CHAMBER_HEATSOAK_MAX_TIME =      params.TIME|default(printer["gcode_macro _USER_VARIABLES"].default_chamber_heatsoak_max_time)|int %}
    {% set travel_speed=                    printer["gcode_macro _USER_VARIABLES"].travel_speed * 60 %}
    {% set max_x =                          printer.toolhead.axis_maximum.x|float %}
    {% set max_y =                          printer.toolhead.axis_maximum.y|float %}
    {% set chamber_sensor_name =            printer["gcode_macro _USER_VARIABLES"].chamber_temperature_sensor_name %}
    {% set current_temp =                   printer["temperature_sensor " ~ chamber_sensor_name].temperature|float %}
    {% set bed_temp =                       printer.save_variables.variables.last_bed_temperature|default(printer["gcode_macro _USER_VARIABLES"].default_bed_temp)|float %}

    RESPOND MSG="Heatsoaking chamber. Target: {CHAMBER_HEATSOAK_TARGET_TEMP}°C, {CHAMBER_HEATSOAK_MAX_TIME} minute(s)"
    STATUS_LEDS COLOR="HEATING"

    RESPOND MSG="Setting bed temparature to {bed_temp}°C"
    M190 S{bed_temp}
    
    FILTER ENABLED=1 SPEED=100
    M106 S230

    {% if printer.toolhead.homed_axes != "xyz" %}
        RESPOND TYPE=error MSG="Axis not homed, toolhead will not move to the center"
    {% else %}
        G0 X{max_x|int / 2} Y{max_y|int / 2} Z50 F{travel_speed}
    {% endif %}
    
    {% for t in range(0, CHAMBER_HEATSOAK_MAX_TIME * 2) %}
        {% if current_temp <= CHAMBER_HEATSOAK_TARGET_TEMP %}
            RESPOND MSG="Heatsoaking chamber: {current_temp}°C/{CHAMBER_HEATSOAK_TARGET_TEMP}°C. {CHAMBER_HEATSOAK_MAX_TIME - t * 0.5} minute(s) left."
            G4 P30000 # 30 seconds
        {% endif %}
    {% endfor %}
    
    RESPOND MSG="Bed heatsoaking complete. Bed heater: ON"
    STATUS_LEDS COLOR="READY"


[gcode_macro PURGE]
gcode:
    {% set DISTANCE =       params.DISTANCE|default(printer["gcode_macro _USER_VARIABLES"].purge_distance)|float %}
    {% set OOZE_TIME =      params.OOZE_TIME|default(printer["gcode_macro _USER_VARIABLES"].purge_ooze_time)|float %}
    {% set TEMP =           params.TEMP|default(printer.save_variables.variables.last_extruder_temperature)|float %}
    {% set z_lift_speed =   printer["gcode_macro _USER_VARIABLES"].z_lift_speed|default(50)|float * 60 %}
    {% set z_drop_speed =   printer["gcode_macro _USER_VARIABLES"].z_drop_speed|default(50)|float * 60 %}
    {% set original_z =      printer.toolhead.position.z %}

    {% if printer.toolhead.homed_axes != "xyz" %}
       {action_raise_error("Axis not homed, ABORTING")}
    {% endif %}

    RESPOND MSG="Purging at {TEMP}°C"

    SAVE_GCODE_STATE NAME=PURGE_STATE

        MOVE_TO_PURGE_LOCATION
        STATUS_LEDS COLOR="CLEANING"
        RESPOND MSG="Purging filament"
        MOVE_TO_PURGE_LOCATION Z_DROP=1

        M109 S{TEMP}
        G92 E0
        G1 E{DISTANCE} F300
        G92 E0
        G1 E-1.7 F2100
        G1 E-18.3 F150
        G92 E0
        G4 P{OOZE_TIME * 1000}

        M400

        {% set current_z = printer.toolhead.position.z %}
        {% if current_z < original_z %}
            RESPOND MSG="Raising Z to {original_z + 5}"
            G1 Z{original_z + 5} F{z_drop_speed}
        {% endif %}
        STATUS_LEDS COLOR="READY"

    RESTORE_GCODE_STATE NAME=PURGE_STATE MOVE=1


[gcode_macro MOVE_TO_PURGE_LOCATION]
gcode:
    {% set travel_speed =           printer["gcode_macro _USER_VARIABLES"].travel_speed|default(100)|float * 60 %}
    {% set z_drop_speed =           printer["gcode_macro _USER_VARIABLES"].z_drop_speed|default(50)|float * 60 %}
    {% set purge_location_xyz =     printer["gcode_macro _USER_VARIABLES"].purge_location_xyz|default("0,0,10") %}
    {% set Px, Py, Pz =             purge_location_xyz|map('float') %}

    {% if printer.toolhead.homed_axes != "xyz" %}
       {action_raise_error("Axis not homed, ABORTING")}
    {% endif %}

    G90
    G1 X{Px} Y{Py} F{travel_speed}
    G1 Z{Pz} F{z_drop_speed}


[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set TEMP =                       params.TEMP|default(printer.save_variables.variables.last_extruder_temperature)|float %}
    {% set DISTANCE =                   params.DISTANCE|default(105)|float %}
    {% set re_enable_filament_sensor =  0 %}
    {% set initial_pressure_advance =   printer.extruder.pressure_advance|default(0) %}
    
    RESPOND MSG="Unloading filament at {TEMP}°C"

    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE

        FILAMENT_SENSORS ENABLED=0
        M109 S{TEMP}
        SET_PRESSURE_ADVANCE ADVANCE=0
        M82
        G92 E0
        G1 E2 F3600
        G1 E0 F3600
        G1 E3 F3600
        G1 E0 F3600
        G1 E4 F3600
        G1 E0 F3600
        SET_PRESSURE_ADVANCE ADVANCE={initial_pressure_advance}
        M400
        M83
        G1 E-20 F3600
        G4 P3000
        G1 E{DISTANCE|float * -1} F3000
        M400
        FILAMENT_SENSORS ENABLED=1

    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE


[gcode_macro LOAD_FILAMENT]
gcode:
    {% set TEMP =                       params.TEMP|default(printer.save_variables.variables.last_extruder_temperature)|float %}
    {% set DISTANCE =                   params.DISTANCE|default(105)|float %}

    {% if printer.toolhead.homed_axes != "xyz" %}
       {action_raise_error("Axis not homed, ABORTING")}
    {% endif %}

    RESPOND MSG="Loading filament at {TEMP}°C"

    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
        MOVE_TO_PURGE_LOCATION
        FILAMENT_SENSORS ENABLED=0
        M109 S{TEMP}
        M83
        G92 E0
        G1 E{DISTANCE|float} F200
        G1 E50 F150
        M400
        G92 E0
        M400
        FILAMENT_SENSORS ENABLED=1

    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE


[gcode_macro FILTER]
gcode:
    {% set ENABLED =        params.ENABLED|default("1")|int %}
    {% set SPEED =          params.SPEED|default(100)|float %}
    {% set filter_name =    printer["gcode_macro _USER_VARIABLES"].filter_name %}

    {% if ENABLED == 1 %}
        SET_FAN_SPEED FAN={filter_name} SPEED={SPEED / 100}
        RESPOND MSG="Filter enabled, speed: {SPEED}"
    {% elif ENABLED == 0 %}
        SET_FAN_SPEED FAN={filter_name} SPEED=0
        RESPOND MSG="Filter disabled"
    {% else %}
        RESPOND MSG="Error: Invalid ENABLED value, must be 0 or 1"
    {% endif %}


[delayed_gcode _FILTER_DELAYED]
gcode:
    FILTER ENABLED=0


