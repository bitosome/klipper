[gcode_shell_command git_pull]
command: bash -c "cd /home/pi/printer_data/config && git reset --hard HEAD && git pull"
timeout: 10
verbose: True


[gcode_macro GIT_PULL]
gcode:
  _GIT_PULL_PROMPT


[gcode_macro _GIT_PULL_ACTION]
gcode:
  RUN_SHELL_COMMAND CMD=git_pull
  RESPOND TYPE=command MSG="action:prompt_end"
  

[gcode_macro _GIT_PULL_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Running 'git pull' command"
    RESPOND TYPE=command MSG="action:prompt_text This will DOWNLOAD the latest changes from the repository. Are you sure?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Yes|_GIT_PULL_ACTION|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button No|error|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_shell_command git_commit_and_push]
command: bash -c "cd /home/pi/printer_data/config && git add . && git commit -m \"$(date '+%d.%m.%Y %H:%M:%S') changes from printer\" && git push"
timeout: 20
verbose: True


[gcode_macro GIT_COMMIT_AND_PUSH]
gcode:
  _GIT_COMMIT_AND_PUSH_PROMPT


[gcode_macro _GIT_COMMIT_AND_PUSH_ACTION]
gcode:
  RUN_SHELL_COMMAND CMD=git_commit_and_push
  RESPOND TYPE=command MSG="action:prompt_end"
  

[gcode_macro _GIT_COMMIT_AND_PUSH_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Running 'git commit and push' command"
    RESPOND TYPE=command MSG="action:prompt_text This will UPLOAD the latest changes to the repository. Are you sure?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Yes|_GIT_COMMIT_AND_PUSH_ACTION|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button No|error|RESPOND TYPE=command MSG=action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_show"