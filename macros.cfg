[gcode_macro PURGE]
gcode:
    {% set MOVE_TO_PURGE_LOCATION =     params.MOVE_TO_PURGE_LOCATION|default("0")|int %}
    {% set DISTANCE =                   params.DISTANCE|default(printer["gcode_macro _USER_VARIABLES"].purge_distance)|float %}
    {% set OOZE_TIME =                  params.OOZE_TIME|default(printer["gcode_macro _USER_VARIABLES"].purge_ooze_time)|float %}
    {% set TEMP =                       params.TEMP|default(printer.save_variables.variables.last_extruder_temperature)|float %}
    {% set z_lift_speed =               printer["gcode_macro _USER_VARIABLES"].z_lift_speed|float * 60 %}
    {% set z_drop_speed =               printer["gcode_macro _USER_VARIABLES"].z_drop_speed|float * 60 %}
    {% set original_z =                 printer.toolhead.position.z %}

    RESPOND MSG="Purging at {TEMP}°C"

    SAVE_GCODE_STATE NAME=PURGE_STATE

        STATUS_LEDS COLOR="cleaning"

        {% if MOVE_TO_PURGE_LOCATION == 1 %}
            {% if printer.toolhead.homed_axes != "xyz" %}
                RESPOND TYPE=error MSG="Axis not homed, toolhead will not move to purge location"
            {% else %}
                MOVE_TO_PURGE_LOCATION
            {% endif %}
        {% endif %}

        M109 S{TEMP}
        G92 E0
        G1 E{DISTANCE} F300
        G92 E0
        G1 E-1.7 F2100
        G1 E-18.3 F150
        G92 E0
        G4 P{OOZE_TIME * 1000}

        M400

        {% set current_z = printer.toolhead.position.z %}

        {% if current_z < original_z %}
            RESPOND MSG="Raising Z to {original_z + 5}"
            G1 Z{original_z + 5} F{z_drop_speed}
        {% endif %}

    RESTORE_GCODE_STATE NAME=PURGE_STATE MOVE=1


[gcode_macro MOVE_TO_PURGE_LOCATION]
gcode:
    {% set travel_speed =           printer["gcode_macro _USER_VARIABLES"].travel_speed|float * 60 %}
    {% set z_drop_speed =           printer["gcode_macro _USER_VARIABLES"].z_drop_speed|float * 60 %}
    {% set purge_location_xyz =     printer["gcode_macro _USER_VARIABLES"].purge_location_xyz %}
    {% set Px, Py, Pz =             purge_location_xyz|map('float') %}

    {% if printer.toolhead.homed_axes != "xyz" %}
       {action_raise_error("Axis not homed, ABORTING")}
    {% endif %}

    G90
    G1 X{Px} Y{Py} F{travel_speed}
    G1 Z{Pz} F{z_drop_speed}


[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set TEMP =                       params.TEMP|default(printer.save_variables.variables.last_extruder_temperature)|float %}
    {% set DISTANCE =                   params.DISTANCE|default(105)|float %}
    {% set initial_pressure_advance =   printer.extruder.pressure_advance %}
    
    RESPOND MSG="Unloading filament at {TEMP}°C"

    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    
        FILAMENT_SENSORS ENABLED=0

        M109 S{TEMP}
        SET_PRESSURE_ADVANCE ADVANCE=0
        M82
        G92 E0
        G1 E2 F3600
        G1 E0 F3600
        G1 E3 F3600
        G1 E0 F3600
        G1 E4 F3600
        G1 E0 F3600
        SET_PRESSURE_ADVANCE ADVANCE={initial_pressure_advance}
        M400
        M83
        G1 E-20 F3600
        G4 P3000
        G1 E{DISTANCE|float * -1} F3000
        M400

    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE


[gcode_macro LOAD_FILAMENT]
gcode:
    {% set MOVE_TO_PURGE_LOCATION =     params.MOVE_TO_PURGE_LOCATION|default("0")|int %}
    {% set TEMP =                       params.TEMP|default(printer.save_variables.variables.last_extruder_temperature)|float %}
    {% set DISTANCE =                   params.DISTANCE|default(50)|float %}

    RESPOND TYPE=command MSG="action:prompt_end"

    RESPOND MSG="Loading filament at {TEMP}°C"

    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE

        {% if MOVE_TO_PURGE_LOCATION == 1 %}
            {% if printer.toolhead.homed_axes != "xyz" %}
                RESPOND TYPE=error MSG="Axis not homed, toolhead will not move to purge location"
            {% else %}
                MOVE_TO_PURGE_LOCATION
            {% endif %}
        {% endif %}

        FILAMENT_SENSORS ENABLED=0

        M109 S{TEMP}
        M83
        G92 E0
        G1 E{DISTANCE} F200
        G1 E50 F150
        M400
        G92 E0
        M400

        _LOAD_FILAMENT_PROMPT

    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE


[gcode_macro _LOAD_FILAMENT_PROMPT]
gcode:
      RESPOND TYPE=command MSG="action:prompt_begin Load filament"
      RESPOND TYPE=command MSG="action:prompt_text Is the filament extruding as expected?"
      RESPOND TYPE=command MSG="action:prompt_footer_button Yes|RESPOND TYPE=command MSG=action:prompt_end"
      RESPOND TYPE=command MSG="action:prompt_footer_button No|EXTRUDE|warning"
      RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro EXTRUDE]
gcode:
    SAVE_GCODE_STATE NAME=EXTRUDE_STATE

    {% if printer.extruder.can_extrude %}
        M83
        G1 E20 F300
        M400
        _LOAD_FILAMENT_PROMPT
    {% else %}
        RESPOND TYPE=error MSG="Extruder is not ready for extrusion."
    {% endif %}

    RESTORE_GCODE_STATE NAME=EXTRUDE_STATE


[gcode_macro _FILAMENT_RUNOUT_HANDLER]
gcode:
  PAUSE
  RESPOND TYPE=command MSG="action:prompt_begin Filament runout detected"
  RESPOND TYPE=command MSG="action:prompt_text Toolhead filament sensor detected a runout. Please load new filament."
  RESPOND TYPE=command MSG="action:prompt_footer_button Load filament|LOAD_FILAMENT"
  RESPOND TYPE=command MSG="action:prompt_footer_button Extrude|EXTRUDE"
  RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _PRINT_PAUSED_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Print Paused"
    RESPOND TYPE=command MSG="action:prompt_text The print is paused. What would you like to do?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Continue Print|RESUME"
    RESPOND TYPE=command MSG="action:prompt_footer_button Extrude Filament|EXTRUDE"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Print|CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _SET_MPC_MATERIAL]
description: Set heater MPC parameters for a given material

gcode:
    {% set material = params.MATERIAL | upper %}
    {% set heater = params.HEATER | default('extruder') %}
    {% set extruder_config = printer.configfile.settings[heater] %}
    {% set filament_table = printer["gcode_macro _USER_VARIABLES"].filament_table %}

    {% if material in filament_table %}
        {% set (density, heat_capacity) = filament_table[material] %}

        RESPOND PREFIX=🔥 MSG="Configured {heater} MPC for {material}. Density: {density}, Heat Capacity: {heat_capacity}"
    {% else %}
        {% set density = extruder_config.filament_density %}
        {% set heat_capacity=extruder_config.filament_heat_capacity %}

        RESPOND PREFIX=🔥 MSG="Unknown material '{material}', using default mpc parameters for {heater}"
    {% endif %}

    MPC_SET HEATER={heater} FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={heat_capacity}


[gcode_macro FILTER]
gcode:
    {% set ENABLED =        params.ENABLED|default("1")|int %}
    {% set SPEED =          params.SPEED|default(100)|float %}
    {% set filter_name =    printer["gcode_macro _USER_VARIABLES"].filter_name %}

    {% if ENABLED == 1 %}
        SET_FAN_SPEED FAN={filter_name} SPEED={SPEED / 100}
        RESPOND MSG="Filter enabled, speed: {SPEED}"
    {% elif ENABLED == 0 %}
        SET_FAN_SPEED FAN={filter_name} SPEED=0
        RESPOND MSG="Filter disabled"
    {% else %}
        RESPOND MSG="Error: Invalid ENABLED value, must be 0 or 1"
    {% endif %}


[delayed_gcode _FILTER_DELAYED]
gcode:
    FILTER ENABLED=0


[gcode_macro STATUS_LEDS]
gcode:
    {% set color = params.COLOR|default('off')|lower %}
    {% set logo_leds_name = printer["gcode_macro _USER_VARIABLES"]["status_leds_logo_led_name"] %}
    {% set nozzle_leds_name = printer["gcode_macro _USER_VARIABLES"]["status_leds_nozzle_led_name"] %}
    {% set logo_transmit = 0 if (logo_leds_name == nozzle_leds_name) else 1 %}
    {% set status_colors = printer["gcode_macro _USER_VARIABLES"].status_colors %}

    {% if not (color in status_colors) %}
        {action_raise_error("COLOR is not valid!")}
    {% endif %}
    
    SET_LED_EFFECT EFFECT={"sb_logo_" + status_colors[color].logo} REPLACE=1 FADETIME=0.5
    SET_LED_EFFECT EFFECT={"sb_nozzle_" + status_colors[color].nozzle} REPLACE=1 FADETIME=0.5


[gcode_macro G28]
rename_existing: G28.1
gcode:
    CASE_LIGHT
    STATUS_LEDS COLOR="homing"
    G28.1 {rawparams}
    STATUS_LEDS COLOR="ready"


[gcode_macro SET_HEATER_TEMPERATURE] # Set extruder or bed temperature without waiting
rename_existing: SET_HEATER_TEMPERATURE_BASE
gcode:
    {% set target = params.TARGET|float %}
    {% set heater = params.HEATER|lower %}
    {% set heater_map = {"extruder": "last_extruder_temperature", "heater_bed": "last_bed_temperature"} %}

    {% if target > 0 %}
        {% if heater in heater_map %}
            # STATUS_LEDS COLOR="heating"
            SAVE_VARIABLE VARIABLE={heater_map[heater]} VALUE={target}
        {% endif %}
    {% elif target == 0 %}
        {% if heater in heater_map %}
            # STATUS_LEDS COLOR="ready"
        {% endif %}
    {% endif %}

    SET_HEATER_TEMPERATURE_BASE {rawparams}


