[gcode_macro EXPERIMENT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Running 'git commit and push' command"
  RESPOND TYPE=command MSG="action:prompt_text This will UPLOAD the latest changes to the repository. Are you sure?"
  RESPOND TYPE=command MSG="action:prompt_footer_button Yes|RESPOND TYPE=command MSG=action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_show"