[gcode_macro LOAD_FILAMENT]
gcode:
    {% set MOVE_TO_PURGE_LOCATION =     params.MOVE_TO_PURGE_LOCATION|default("0")|int %}
    {% set TEMP =                       params.TEMP|default(printer.save_variables.variables.last_extruder_temperature)|float %}
    {% set DISTANCE =                   params.DISTANCE|default(50)|float %}

    RESPOND MSG="Loading filament at {TEMP}°C"

    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE

        {% if MOVE_TO_PURGE_LOCATION == 1 %}
            {% if printer.toolhead.homed_axes != "xyz" %}
                RESPOND TYPE=error MSG="Axis not homed, toolhead will not move to purge location"
            {% else %}
                MOVE_TO_PURGE_LOCATION
            {% endif %}
        {% endif %}

        FILAMENT_SENSORS ENABLED=0
        M109 S{TEMP}
        M83
        G92 E0
        G1 E{DISTANCE} F200
        G1 E50 F150
        M400
        G92 E0
        M400

        {% if printer["filament_switch_sensor toolhead_switch_sensor"].filament_detected %}
            _LOAD_FILAMENT_PROMPT
        {% else %}
            RESPOND TYPE=command MSG="action:prompt_begin Filament Not Detected"
            RESPOND TYPE=command MSG="action:prompt_text The filament sensor does not detect filament. Please insert filament and try again."
            RESPOND TYPE=command MSG="action:prompt_footer_button Retry|LOAD_FILAMENT"
            RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end"
            RESPOND TYPE=command MSG="action:prompt_show"
        {% endif %}

        FILAMENT_SENSORS ENABLED=1

    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE


[gcode_macro _LOAD_FILAMENT_PROMPT]
gcode:
    {% if printer["filament_switch_sensor toolhead_switch_sensor"].filament_detected %}
        RESPOND TYPE=command MSG="action:prompt_begin Load Filament"
        RESPOND TYPE=command MSG="action:prompt_text Is the filament extruding as expected?"
        RESPOND TYPE=command MSG="action:prompt_footer_button Yes|RESPOND TYPE=command MSG=action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_footer_button No|EXTRUDE|warning"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament Not Detected"
        RESPOND TYPE=command MSG="action:prompt_text The filament sensor does not detect filament. Please insert filament and try again."
        RESPOND TYPE=command MSG="action:prompt_footer_button Retry|LOAD_FILAMENT"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}


[gcode_macro EXTRUDE]
gcode:
    SAVE_GCODE_STATE NAME=EXTRUDE_STATE

    {% if not printer["filament_switch_sensor toolhead_switch_sensor"].filament_detected %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament Not Detected"
        RESPOND TYPE=command MSG="action:prompt_text No filament detected! Please load filament before extruding."
        RESPOND TYPE=command MSG="action:prompt_footer_button Load Filament|LOAD_FILAMENT"
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif printer.extruder.can_extrude %}
        M83
        G1 E20 F300
    {% else %}
        RESPOND TYPE=error MSG="Extruder is not ready for extrusion."
    {% endif %}

    RESTORE_GCODE_STATE NAME=EXTRUDE_STATE


[gcode_macro _FILAMENT_RUNOUT_HANDLER]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Filament Runout Detected"
    RESPOND TYPE=command MSG="action:prompt_text The filament sensor detected a runout. Please load new filament."
    RESPOND TYPE=command MSG="action:prompt_footer_button Load Filament|LOAD_FILAMENT"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Print|PAUSE"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro PARK]
gcode:
    {% set Px, Py =         printer["gcode_macro _USER_VARIABLES"].park_position_xy|map('float') %}
    {% set Px =             params.X|default(Px)|float %}
    {% set Py =             params.Y|default(Py)|float %}
    {% set park_lift_z =    printer["gcode_macro _USER_VARIABLES"].park_lift_z %}
    {% set Z_HOP =          params.Z_HOP|default(park_lift_z)|float %}
    {% set St =             printer["gcode_macro _USER_VARIABLES"].travel_speed * 60 %}
    {% set Sz =             printer["gcode_macro _USER_VARIABLES"].z_drop_speed * 60 %}
    {% set max_z =          printer.toolhead.axis_maximum.z - printer.gcode_move.homing_origin.z |float %}
    {% set act_z =          printer.toolhead.position.z|float %}
    {% set z_safe =         act_z + Z_HOP %}

    {% if z_safe > max_z %}
        {% set z_safe = max_z %}
    {% endif %}

    {% if printer.toolhead.homed_axes != "xyz" %}
       {action_raise_error("Axis not homed, ABORTING")}
    {% endif %}

    SAVE_GCODE_STATE NAME=PARK

        G90
        G1 Z{z_safe} F{Sz}
        G0 X{Px} Y{Py} F{St}

        {% if printer.print_stats.state == "paused" %}
            RESPOND MSG="Skipping filament retraction since printer is paused."
            _PRINT_PAUSED_PROMPT
        {% else %}
            {% if printer.extruder.can_extrude %}
                {% if params.E is defined %}
                    {% set E = params.E|float|abs %}
                    RESPOND MSG="Retraction overridden with parameter, Extruder retraction = {E}"
                {% else %}
                    {% set E = 1.7 %}
                    RESPOND MSG="Extruder retraction = {E}"
                {% endif %}

                {% if E is defined and E > 0 %}
                    G92 E0
                    G1 E-{E} F2100
                {% endif %}
            {% endif %}
        {% endif %}

    RESTORE_GCODE_STATE NAME=PARK


[gcode_macro _PRINT_PAUSED_PROMPT]
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Print Paused"
    RESPOND TYPE=command MSG="action:prompt_text The print is paused. What would you like to do?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Continue Print|RESUME"
    RESPOND TYPE=command MSG="action:prompt_footer_button Extrude Filament|EXTRUDE"
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Print|CANCEL"
    RESPOND TYPE=command MSG="action:prompt_show"