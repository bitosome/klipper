[include led_effects.cfg]
[include config_colors.cfg]
[include macros.cfg]
[include variables.cfg]
[include timelapse.cfg]
[include macros_experiments.cfg]

[display_status]
[exclude_object]
[respond]
[pause_resume]

[force_move]
enable_force_move: True

[gcode_arcs]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode:
    STATUS_LEDS COLOR="error"
    {% if "xyz" in printer.toolhead.homed_axes %}
        PARK
    {% endif %}

[save_variables]
filename: ~/printer_data/config/save_variables.cfg

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 8000
max_z_velocity: 30
max_z_accel: 500

[idle_timeout]
timeout: 1800
gcode:
    RESPOND MSG="Idle timeout reached (30 minutes)"
    TURN_OFF_HEATERS
    M84
    M107
    FILTER ENABLED=0
    CASE_LIGHT ENABLED=0
    STATUS_LEDS COLOR="off"

[mcu scanner]
canbus_uuid: c68ccf486950 

[scanner]
mcu: scanner
x_offset: 3
y_offset: 27
backlash_comp: 0.00437
sensor: cartographer
sensor_alt: carto
mesh_runs: 1
# scanner_touch_z_offset = 0.080
#mode: touch

[quad_gantry_level]
gantry_corners:
	-60,-10
	410,420
points:
	50,25
	50,275
	300,275
	300,25
speed: 2000
horizontal_move_z: 10
retries: 3
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
speed: 2000
horizontal_move_z: 5
probe_count: 20, 20
mesh_min: 30, 30
mesh_max: 320, 320
fade_start: 0.0
fade_end: 1.0
algorithm: bicubic
zero_reference_position: 175, 175

[safe_z_home]
home_xy_position: 175,175
speed: 100.0
z_hop: 10
z_hop_speed: 15.0
home_y_before_x: False

# ┌─────────────────────────────────────┐
# │     INPUT SHAPING
# └─────────────────────────────────────┘

[adxl345]
cs_pin: scanner:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points: 175, 175, 20

[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 53.8
#shaper_type_y: 2hump_ei
#shaper_freq_y: 53.4

# ┌─────────────────────────────────────┐
# │     BTT MANTA M8P v1.1
