[stepper_z2]
step_pin: MCU_M5_STEP
dir_pin: MCU_M5_DIR
enable_pin: !MCU_M5_EN

rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

[tmc2209 stepper_z2]
uart_pin: MCU_M5_CS
interpolate: True
run_current: 0.8
sense_resistor: 0.110

# ┌─────────────────────────────────────┐
# │     Z3 MOTOR (FRONT RIGHT)
# │     moons-ms17hd6p420I-04
