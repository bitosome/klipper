dir_pin: !MCU_M4_DIR
enable_pin: !MCU_M4_EN

rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: MCU_M4_CS
interpolate: True
run_current: 0.8
sense_resistor: 0.110

# ┌─────────────────────────────────────┐
# │     Z2 MOTOR (REAR RIGHT)
