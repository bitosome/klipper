# ┌─────────────────────────────────────┐
# │     TEMPERATURE SENSORS
# └─────────────────────────────────────┘

[temperature_sensor CM4]
sensor_type: temperature_host
min_temp: 0
max_temp: 90

[temperature_sensor MANTA_M8P_v1_1]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 90

[temperature_sensor BTT_EBB36_CAN_v1_2]
sensor_type: temperature_mcu
sensor_mcu: toolhead
min_temp: 0
max_temp: 90

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: MCU_TH0

[temperature_sensor Cartographer]
sensor_type: temperature_mcu
sensor_mcu: scanner
min_temp: 0
max_temp: 105

[temperature_sensor Hotend_Heatsink]
sensor_type: Generic 3950
sensor_pin: toolhead:PA3
max_temp: 100

# ┌─────────────────────────────────────┐
# │     LIGHT
# └─────────────────────────────────────┘

[neopixel status_leds]
pin: toolhead:MCU_RGB
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0

[output_pin caselight]
pin: MCU_HE3
pwm: true
value: 0
scale: 100
cycle_time: 0.010

# ┌─────────────────────────────────────┐
# │     FANS
# └─────────────────────────────────────┘
   
[controller_fan controller_fans]
pin: MCU_FAN5
tachometer_pin: MCU_FAN5_TACH
kick_start_time: 0.100
fan_speed: 0.9
idle_timeout: 60

[heater_fan hotend_fan]
pin: toolhead:MCU_FAN1
heater: extruder
heater_temp: 50.0

[fan]
pin: toolhead:MCU_FAN2

[fan_generic filter]
pin: MCU_FAN3
kick_start_time: 0.100

# ┌─────────────────────────────────────┐
# │     FILAMENT SENSOR
# └─────────────────────────────────────┘

[filament_switch_sensor toolhead_switch_sensor]
switch_pin: !toolhead:MCU_PROBE
pause_on_runout: True
runout_gcode: _FILAMENT_RUNOUT_HANDLER
insert_gcode: LOAD_FILAMENT

[filament_switch_sensor switch_sensor]
switch_pin: ^MCU_M5_STOP
pause_on_runout: False
runout_gcode: _FILAMENT_SENSOR_NOTIFICATION MESSAGE="Filament runout!"
insert_gcode: _FILAMENT_SENSOR_NOTIFICATION MESSAGE="Filament inserted"

[filament_motion_sensor motion_sensor]
switch_pin: ^MCU_M6_STOP
detection_length: 2.88
extruder: extruder
pause_on_runout: False
runout_gcode: _FILAMENT_SENSOR_NOTIFICATION MESSAGE="Filament motion not detected!"
insert_gcode: _FILAMENT_SENSOR_NOTIFICATION MESSAGE="Filament motion detected"

# ┌─────────────────────────────────────┐
# │     TMC AUTOTUNE
# └─────────────────────────────────────┘

[autotune_tmc stepper_x]
motor: moons-ms17hd6p420I-04
tuning_goal: performance
sg4_thrs: 108

[autotune_tmc stepper_y]
motor: moons-ms17hd6p420I-04
tuning_goal: performance
sg4_thrs: 105

[autotune_tmc stepper_z]
motor: moons-ms17hd6p420I-04
tuning_goal: silent

[autotune_tmc stepper_z1]
motor: moons-ms17hd6p420I-04
tuning_goal: silent

[autotune_tmc stepper_z2]
motor: moons-ms17hd6p420I-04
tuning_goal: silent

[autotune_tmc stepper_z3]
motor: moons-ms17hd6p420I-04
tuning_goal: silent


[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg-9T

