dir_pin: MCU_M3_DIR
enable_pin: !MCU_M3_EN

rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

position_max: 325
endstop_pin: probe:z_virtual_endstop
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: MCU_M3_CS
interpolate: True
run_current: 0.8
sense_resistor: 0.110

