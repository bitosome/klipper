[mcu toolhead]
canbus_uuid: 4202d7c42291

[board_pins toolhead_manufacturer]
mcu: toolhead
aliases:
    MCU_TMCDRIVER_STEP=PD0 , MCU_TMCDRIVER_DIR=PD1 , MCU_TMCDRIVER_ENABLE=PD2 , MCU_TMCDRIVER_UART=PA15 ,
    MCU_ENDSTOP1=PB6 , MCU_ENDSTOP2=PB5 , MCU_ENDSTOP3=PB7 ,
    MCU_PROBE=PB8 ,
    MCU_SERVOS=PB9 ,
    MCU_HOTEND0=PB13 ,
    MCU_TH0=PA3 ,
    MCU_FAN1=PA0 , MCU_FAN2=PA1 ,
    MCU_RGB=PD3 ,
    MCU_SPI1_CS=PA4  , MCU_SPI1_SCLK=PA5  , MCU_SPI1_MISO=PA6 , MCU_SPI1_MOSI=PA7  ,
    MCU_SPI2_CS=PB12 , MCU_SPI2_SCLK=PB10 , MCU_SPI2_MISO=PB2 , MCU_SPI2_MOSI=PB11 ,

# ┌─────────────────────────────────────┐
# │     BED
# └─────────────────────────────────────┘

[heater_bed]
heater_pin: MCU_HE1
sensor_pin: MCU_THB
sensor_type: Generic 3950
max_power: 1
min_temp: 0
max_temp: 125
#control: mpc # MPC_CALIBRATE HEATER=heater_bed TARGET=100 FAN_BREAKPOINTS=5
heater_power: 1000
cooling_fan: fan_generic filter

# ┌─────────────────────────────────────┐
# │     EXTRUDER
# │     ldo-36sth20-1004ahg-9T
# │     resistance: 2.4
# │     inductance: 0.0014
# │     holding_torque: 0.10
# │     max_current: 1.0
# │     steps_per_revolution: 200
# └─────────────────────────────────────┘

[extruder]
step_pin: toolhead:MCU_TMCDRIVER_STEP
dir_pin: toolhead:MCU_TMCDRIVER_DIR
enable_pin: !toolhead:MCU_TMCDRIVER_ENABLE

rotation_distance: 47.088
microsteps: 32
gear_ratio: 9:1

heater_pin: toolhead:MCU_HOTEND0
#control: mpc # MPC_CALIBRATE HEATER=extruder TARGET=260 FAN_BREAKPOINTS=7
heater_power: 70
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8

sensor_type: MAX31865
sensor_pin: toolhead:MCU_SPI1_CS
spi_bus: spi1
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2

pressure_advance: 0.029
pressure_advance_smooth_time: 0.02

nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 110
max_extrude_cross_section: 5
min_temp: 0
max_temp: 300
max_power: 1
min_extrude_temp: 200

[tmc2209 extruder]
uart_pin: toolhead:MCU_TMCDRIVER_UART
interpolate: True
run_current: 0.6
sense_resistor: 0.110

# ┌─────────────────────────────────────┐
# │     X MOTOR (B)
# │     moons-ms17hd6p420I-04
# │     resistance: 1.3
# │     inductance: 0.0027
# │     holding_torque: 0.67
# │     max_current: 2.0
# │     steps_per_revolution: 200
# └─────────────────────────────────────┘

[stepper_x]
step_pin: MCU_M1_STEP
dir_pin: MCU_M1_DIR
enable_pin: !MCU_M1_EN

rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200

position_min: 0
position_max: 350
position_endstop: 350
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 5
homing_retract_speed: 20
homing_speed: 100
min_home_dist: 40
second_homing_speed: 100
use_sensorless_homing: True

[tmc2209 stepper_x]
uart_pin: MCU_M1_CS
diag_pin: MCU_M1_STOP
interpolate: True
run_current: 0.9
home_current: 0.6
current_change_dwell_time: 0.5
# driver_SGTHRS: 108
sense_resistor: 0.110

# ┌─────────────────────────────────────┐
# │     Y MOTOR (A)
# │     moons-ms17hd6p420I-04
# └─────────────────────────────────────┘

[stepper_y]
step_pin: MCU_M2_STEP
dir_pin: MCU_M2_DIR
enable_pin: !MCU_M2_EN

rotation_distance: 40
microsteps: 64
full_steps_per_rotation: 200

position_min: 0
position_max: 350
position_endstop: 350
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 5
homing_retract_speed: 20
homing_speed: 100
min_home_dist: 40
second_homing_speed: 100
use_sensorless_homing: True

[tmc2209 stepper_y]
uart_pin: MCU_M2_CS
diag_pin: ^MCU_M2_STOP
interpolate: True
run_current: 0.9
home_current: 0.6
current_change_dwell_time: 0.5
# driver_SGTHRS: 104
sense_resistor: 0.110

# ┌─────────────────────────────────────┐
# │     Z0 MOTOR (FRONT LEFT)
# │     moons-ms17hd6p420I-04
# └─────────────────────────────────────┘

[stepper_z]
step_pin: MCU_M3_STEP
dir_pin: MCU_M3_DIR
enable_pin: !MCU_M3_EN

rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
full_steps_per_rotation: 200

position_max: 325
endstop_pin: probe:z_virtual_endstop
homing_speed: 50
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: MCU_M3_CS
interpolate: True
run_current: 0.8
sense_resistor: 0.110

